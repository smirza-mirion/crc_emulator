<!--
	Byte
	100 - Show Screen
	
	String
	100 	- Comment
	101,102 - Title
	103,104 - Question
	105	- Comment Label
	106,107 - Please enter Comment:
	108	- YES
	109	- NO
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_INACTIVATE);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.sfCommentLabel.forceUpdate(),
														     Amulet:document.sfCommentLabel.reappear(),
														     Amulet:document.btnComment.forceUpdate(),
														     Amulet:document.btnComment.reappear(),
														     Amulet:document.sfQuestion.forceUpdate(),
														     Amulet:document.sfQuestion.reappear(),
														     Amulet:document.btnYes.forceUpdate(),
														     Amulet:document.btnYes.reappear(),
														     Amulet:document.btnNo.forceUpdate(),
														     Amulet:document.btnNo.reappear();
														     NAME=refreshShow">
		
		<style type="text/css">
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
			#comment_title {position:absolute;left:0;top:100;width:0;height:0}
			#comment {position:absolute;left:150;top:100;width:0;height:0}
			#question {position:absolute;left:50;top:200;width:0;height:0}
			#yes {position:absolute;left:50;top:250;width:0;height:0}
			#no {position:absolute;left:250;top:250;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(101).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="comment_title">
			<!--TABLE WIDTH="150" HEIGHT="40">
				<TR>
					<TD WIDTH="150" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I><B>Comment:</B></I></FONT></TD>
				</TR>
			</TABLE-->
			<APPLET CODE="Stringfield.class" WIDTH="150" HEIGHT="40" NAME="sfCommentLabel">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="ITALIC|BOLD">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(105).value()">
				<PARAM NAME="printf" VALUE=" %s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="comment">
			<APPLET CODE="CustomButton.class" WIDTH="380" HEIGHT="40" Name="btnComment">
				<PARAM NAME="upImage" VALUE="Images/380x40.png">
				<PARAM NAME="downImage" VALUE="Images/380x40.png">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontStyle" VALUE="PLAIN">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(100).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="%ConfigTitle(Amulet:internalRAM.string(106)), %ConfigMaxStrLen(22), %ConfigKeyboard(%%CONFIG_KEYBOARD_TEMP_UPPER), %HideWildcardChar, %SetKeyboard(%%SET_KEYBOARD_INACTIVATE_COMMENT)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="question">
			<APPLET CODE="StringField.class" WIDTH="650" HEIGHT="40" NAME="sfQuestion">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="fontStyle" VALUE="ITALIC|BOLD">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(103).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
			<!--TABLE WIDTH="650" HEIGHT="40">
				<TR>
					<TD WIDTH="650" HEIGHT="40" ALIGN="LEFT"><FONT SIZE="6" FACE="Franklin Gothic Book"><I><B>Inactivate record?</B></I></FONT></TD>
				</TR>
			</TABLE-->
		</DIV>
		
		<DIV ID="yes">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="50" NAME="btnYes">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<!--PARAM NAME="label" VALUE="YES"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(108).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnYes.disappear(), Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="no">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="50" NAME="btnNo">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<!--PARAM NAME="label" VALUE="NO"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(109).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnNo.disappear(), Amulet:UART.word(0).setValue(0x0103)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
