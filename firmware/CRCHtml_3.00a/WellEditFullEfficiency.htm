<!--
	Byte
	100 - Display Values
	
	String
	100 - Full Spectrum Efficiency
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_WELL_EDIT_FULL_EFFICIENCY);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfFullEff.forceUpdate();
														     NAME=refreshShow">
		
		<style type="text/css">
			#backgnd {position:absolute;left:0;top:0;width:800;height:600}
			#backgnd1 {position:absolute;left:0;top:41;width:800;height:518}
			#top {position:absolute;left:0;top:0;width:0;height:0}
			#bottom {position:absolute;left:0;top:556;width:0;height:0}
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#logo {position:absolute;left:5;top:1;width:0;height:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#back {position:absolute;left:695;top:10;width:0;height:0}
			#print {position:absolute;left:695;top:563;width:0;height:0}
			#setup {position:absolute;left:5;top:563;width:0;height:0}
			#efflabel {position:absolute;left:0;top:280;width:0;height:0}
			#efftext {position:absolute;left:350;top:280;width:0;height:0}
			#accept {position:absolute;left:490;top:542;width:0;height:0}
			#cancel {position:absolute;left:645;top:542;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="Edit Wipe Full Spectrum Efficiency">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<!--DIV ID="back">
			<APPLET CODE="FunctionButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="label" VALUE="Back">
				<PARAM NAME="href" VALUE="%Back">
			</APPLET>
		</DIV-->
		
		<DIV ID="efflabel">
			<TABLE WIDTH="350" HEIGHT="40">
				<TR>
					<TD WIDTH="350" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I>Full Spectrum Efficiency:</I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="efftext">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="40" NAME="sfFullEff">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="efftext">
			<APPLET CODE="FunctionButton.class" WIDTH="200" HEIGHT="40" NAME="btnFullEff">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="borderColor" VALUE="#00000000">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle('Please Enter Full Spectrum Efficiency %:'), %ConfigMaxStrLen(2), %ConfigMaxFractionLen(3), %ConfigMinValue('.001'), %ConfigMaxValue('99.999'),%ConfigKeypad(%%CONFIG_KEYPAD_FLOAT), %ConfigPlusMinus_OFF,%SetKeypad(%%SET_KEYPAD_WIPE_FULL_EFFICIENCY)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="accept">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnAccept">
				<PARAM NAME="label" VALUE="Accept">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnAccept.disappear(), Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="cancel">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnCancel">
				<PARAM NAME="label" VALUE="Cancel">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnCancel.disappear(), %Back">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
