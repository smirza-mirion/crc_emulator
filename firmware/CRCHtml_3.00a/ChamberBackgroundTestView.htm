<!--
	Memory Map
	Byte
	20	= Show Chamber Label (TOGGLE)
	80	= Language		(STATE) English = 0, French = 1
	100	= Print Button (STATE)
	101	= Inactivate Button (STATE) FF = Inactivate Button, FE = Inactivate Reason
	102	= Redisplay Buttons (TOGGLE)
	103	= Display Background Red (STATE)
	
	String
	100,101	= Title
	102	= Chamber Description
	103	= Chamber Serial Number
	104	= Date
	105	= Background Label
	106,107	= Background
	108	= Inactivate
	109,110	= Inactivate Text
-->
