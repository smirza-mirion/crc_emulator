<!-- Memory Map
	Byte
	99  = French Active
	100 = Refresh Display (0xFF)
	101 = Refresh Title (0xFF)
	102 = Set to Cap Lock State (0xFF)
	103 = Set to Cap Temp State (0xFF)
	104 - Show Accept
	105 - Show Percent
	106 - Show Accent
	107 - Show lower case NTILDE and UUM
	254 = Shift state,
	      0 = Lower
	      1 = Upper Temp
	      2 = Upper
	255 = Accent state
	      0 = No Accent
	      1 = Accent
	
	String
	100,101 = Title
	102,103 = Output String
	104 = Indicator
	105 = L_Backspace
	106 = L_Shift
	107 = L_Wildcard
	108 = L_Accept
	109 = L_Cancel
	
	200 = Accent
	201 = Ñ
	202 = ñ
	203 = Ü
	204 = ü
	205 = Á
	206 = É
	207 = Í
	208 = Ó
	209 = Ú
	210 = á
	211 = é
	212 = í
	213 = ó
	214 = ú

	LAUNCHES
		%SetKeyboard
	REQUIRES
		%ConfigTitle
		%ConfigMaxStrLen
-->
