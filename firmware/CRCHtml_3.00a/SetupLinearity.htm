<!--
	Byte
	92		= Language		(STATE) English = 0, French = 1
	93		= CRC-77t		(STATE) Not CRC-77t = 0, CRC-77t = 1
	
	String
	110 - Title
	111 - 112  - Standard R Chamber
	113 - 114  - Standard PET Chamber
-->
<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_SETUP_LINEARITY);NAME=refreshInit">

	<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshShowHomeEnglish.forceUpdate(),
						    Amulet:document.refreshShowHomeFrench.forceUpdate();
						    NAME=refreshShowHome">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x00;URL=Amulet:document.btnHome.reappear();
													     NAME=refreshShowHomeEnglish">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x01;URL=Amulet:document.btnHomeFrench.reappear();
													     NAME=refreshShowHomeFrench">
													     
	<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshHideHomeEnglish.forceUpdate(),
						    Amulet:document.refreshHideHomeFrench.forceUpdate();
						    NAME=refreshHideHome">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x00;URL=Amulet:document.btnHome.disappear();
													     NAME=refreshHideHomeEnglish">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x01;URL=Amulet:document.btnHomeFrench.disappear();
													     NAME=refreshHideHomeFrench">

	<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshShowBackEnglish.forceUpdate(),
						    Amulet:document.refreshShowBackFrench.forceUpdate();
						    NAME=refreshShowBack">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x00;URL=Amulet:document.btnBack.reappear();
													     NAME=refreshShowBackEnglish">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x01;URL=Amulet:document.btnBackFrench.reappear();
													     NAME=refreshShowBackFrench">
													     
	<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshHideBackEnglish.forceUpdate(),
						    Amulet:document.refreshHideBackFrench.forceUpdate();
						    NAME=refreshHideBack">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x00;URL=Amulet:document.btnBack.disappear();
													     NAME=refreshHideBackEnglish">
	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0x01;URL=Amulet:document.btnBackFrench.disappear();
													     NAME=refreshHideBackFrench">

	<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(93).value();TRIGGER=0x00;URL=Amulet:document.btnStandardP.reappear(),
													    Amulet:document.btnStandardP.forceUpdate();
													    NAME=refreshShowStandardP">

		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(102).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(102).setValue(0),
														     Amulet:document.refreshShowHome.forceUpdate(),
														     Amulet:document.refreshShowBack.forceUpdate(),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.btnStandardR.reappear(),
														     Amulet:document.btnStandardR.forceUpdate(),
														     Amulet:document.refreshShowStandardP.forceUpdate();
														     NAME=refreshShowButtons">

		
		<style type="text/css">
			#backgnd {position:absolute;left:0;top:0;width:800;height:600}
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:120;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#standard_R {position:absolute;left:200;top:115;width:0;height:0}
			#standard_P {position:absolute;left:200;top:215;width:0;height:0}
			#lineator {position:absolute;left:200;top:315;width:0;height:0}
			#calicheck {position:absolute;left:200;top:415;width:0;height:0}
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="560" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<!--PARAM NAME="initialCondition" VALUE="Setup Linearity">
				<PARAM NAME="href" VALUE="Amulet:NOP()"-->
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(110).value()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHome">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Home">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/home_big.png">
				<PARAM NAME="downImage" VALUE="Images/home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHomeFrench">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Home">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/french_home_big.png">
				<PARAM NAME="downImage" VALUE="Images/french_home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/back_big.png">
				<PARAM NAME="downImage" VALUE="Images/back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBackFrench">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/french_back_big.png">
				<PARAM NAME="downImage" VALUE="Images/french_back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="standard_R">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnStandardR">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<!--PARAM NAME="label" VALUE="Standard R Chamber"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(111).value()">
				<PARAM NAME="href" VALUE="Amulet:UART.byte(0).setValue(0x11), %SetClear(%%SET_CLEAR_SETUPLINEARITYSTANDARD)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="standard_P">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnStandardP">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<!--PARAM NAME="label" VALUE="Standard PET Chamber"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(112).value()">
				<PARAM NAME="href" VALUE="Amulet:UART.byte(0).setValue(0x12), %SetClear(%%SET_CLEAR_SETUPLINEARITYSTANDARD)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="lineator">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnLineator">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="label" VALUE="Lineator">
				<PARAM NAME="href" VALUE="%SetClear(%%SET_CLEAR_SETUPLINEARITYLINEATOR)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="calicheck">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnCalicheck">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="label" VALUE="Calicheck">
				<PARAM NAME="href" VALUE="%SetClear(%%SET_CLEAR_SETUPLINEARITYCALICHECK)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
