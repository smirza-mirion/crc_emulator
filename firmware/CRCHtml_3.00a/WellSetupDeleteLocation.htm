<!--
	Byte

-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_WELL_SETUP_DELETE_LOC);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfLocation.forceUpdate(),
														     Amulet:document.sfLocation.reappear(),
														     Amulet:document.sfType.forceUpdate(),
														     Amulet:document.sfType.reappear(),
														     Amulet:document.sfThreshold.forceUpdate(),
														     Amulet:document.sfThreshold.reappear(),
														     Amulet:document.sfCountTime.forceUpdate(),
														     Amulet:document.sfCountTime.reappear(),
														     Amulet:document.btnYes.reappear(),
														     Amulet:document.btnNo.reappear();
														     NAME=refreshShow">
		
		<style type="text/css">
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
			#location_name_title {position:absolute;left:0;top:100;width:0;height:0}
			#location_name {position:absolute;left:200;top:100;width:0;height:0}
			#wipe_name_title {position:absolute;left:0;top:150;width:0;height:0}
			#wipe_name {position:absolute;left:200;top:150;width:0;height:0}
			#threshold_title {position:absolute;left:0;top:200;width:0;height:0}
			#threshold {position:absolute;left:200;top:200;width:0;height:0}
			#count_time_title {position:absolute;left:0;top:250;width:0;height:0}
			#count_time {position:absolute;left:200;top:250;width:0;height:0}
			#question {position:absolute;left:50;top:350;width:0;height:0}
			#yes {position:absolute;left:50;top:400;width:0;height:0}
			#no {position:absolute;left:250;top:400;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="Delete Wipe Location">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<DIV ID="location_name_title">
			<TABLE WIDTH="200" HEIGHT="40">
				<TR>
					<TD WIDTH="200" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I><B>Location:</B></I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="location_name">
			<APPLET CODE="Stringfield.class" WIDTH="600" HEIGHT="50" NAME="sfLocation">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="16pt">
				<PARAM NAME="fontStyle" VALUE="NORNAL">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="wipe_name_title">
			<TABLE WIDTH="200" HEIGHT="40">
				<TR>
					<TD WIDTH="200" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I><B>Wipe Type:</B></I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="wipe_name">
			<APPLET CODE="Stringfield.class" WIDTH="600" HEIGHT="50" NAME="sfType">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="16pt">
				<PARAM NAME="fontStyle" VALUE="NORNAL">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(102).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="threshold_title">
			<TABLE WIDTH="200" HEIGHT="40">
				<TR>
					<TD WIDTH="200" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I><B>Trigger:</B></I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="threshold">
			<APPLET CODE="Stringfield.class" WIDTH="600" HEIGHT="50" NAME="sfThreshold">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="16pt">
				<PARAM NAME="fontStyle" VALUE="NORNAL">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(104).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="count_time_title">
			<TABLE WIDTH="200" HEIGHT="40">
				<TR>
					<TD WIDTH="200" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I><B>Count Time:</B></I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="count_time">
			<APPLET CODE="Stringfield.class" WIDTH="600" HEIGHT="50" NAME="sfCountTime">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="16pt">
				<PARAM NAME="fontStyle" VALUE="NORNAL">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(106).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="question">
			<TABLE WIDTH="750" HEIGHT="40">
				<TR>
					<TD WIDTH="750" HEIGHT="40" ALIGN="LEFT"><FONT SIZE="6" FACE="Franklin Gothic Book"><I><B>Delete this wipe location?</B></I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="yes">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="50" NAME="btnYes">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="label" VALUE="YES">
				<PARAM NAME="href" VALUE="Amulet:document.btnYes.disappear(), Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="no">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="50" NAME="btnNo">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="label" VALUE="NO">
				<PARAM NAME="href" VALUE="Amulet:document.btnNo.disappear(), %Back">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
