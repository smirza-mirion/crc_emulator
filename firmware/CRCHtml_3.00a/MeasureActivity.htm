<!--
	Memory Map
	Byte
	100 = Display Screen (0xFF)
	101 = Refresh Display (0xFF)
	102 = Refresh White Message (0xFF)
	103 = Refresh Red Message (0xFF)
	
	String
	100,101 = Title
	102	= Nuclide
	103 	= Display
	104,105 = White Message
	106,107 = Red Message
	108	= Accept
	109	= Cancel
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0, 0.01; URL=%SetScreen(%%SCREEN_MEASURE); NAME=refreshInit">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.btnAccept.forceUpdate(),
														     Amulet:document.btnAccept.reappear(),
														     Amulet:document.btnCancel.forceUpdate(),
														     Amulet:document.btnCancel.reappear();
														     Name=refreshDisplayMeasure">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(101).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(101).setValue(0),
														     Amulet:document.sfNuclide.forceUpdate(),
		                                                                                                     Amulet:document.sfDisplay.forceUpdate();
														     NAME=refreshShowDisplay">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(102).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(102).setValue(0),
														     Amulet:document.sfMessageWhite.forceUpdate();
														     NAME=refreshShowWhite">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(103).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(103).setValue(0),
														     Amulet:document.sfMessageRed.forceUpdate();
														     NAME=refreshShowRed">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(104).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(104).setValue(0),
														     Amulet:document.sfMessageWhite.reappear(),
														     Amulet:document.sfMessageWhite.forceUpdate();
														     Name=refreshReappearWhite">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(105).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(105).setValue(0),
														     Amulet:document.sfMessageRed.reappear(),
														     Amulet:document.sfMessageRed.forceUpdate();
														     Name=refreshReappearRed">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(106).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(106).setValue(0),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.btnCancel.forceUpdate(),
														     Amulet:document.btnCancel.reappear();
														     Name=refreshDisplayCancel">

		<style type="text/css">
			#background {position:absolute;left:0;top:0;width:800;height:600}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#nuclide {position:absolute;left:0;top:125;width:0;height:0}
			#display {position:absolute;left:10;top:225;width:0;height:0}
			#message {position:absolute;left:0;top:375;width:0;height:0}
			#accept {position:absolute;left:483;top:533;width:0;height:0}
			#cancel {position:absolute;left:641;top:533;width:0;height:0}
		</style>
	</HEAD>
	
	<BODY>
		<DIV ID="background" STYLE="background-color:black">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="790" HEIGHT="60" NAME="sfTitle">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="fillColor" VALUE="#000030">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="BOTTOM">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontColor" VALUE="#FFFF30">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="updateRate" VALUE="0.0">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="nuclide">
			<APPLET CODE="StringField.class" WIDTH="800" HEIGHT="100" NAME="sfNuclide">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="fillColor" VALUE="#000000">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="TOP">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(102).value()">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="font" VALUE="Arial Black Bold">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="updateRate" VALUE="0.0">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="display">
			<APPLET CODE="StringField.class" WIDTH="780" HEIGHT="150" NAME="sfDisplay">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="horizontalAlign" VALUE="MIDDLE">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(103).value()">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="font" VALUE="Arial Black Bold">
				<PARAM NAME="fontSize" VALUE="72pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="updateRate" VALUE="0.0">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="message">
			<APPLET CODE="StringField.class" WIDTH="800" HEIGHT="100" NAME="sfMessageWhite">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="fillColor" VALUE="#000000">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="BOTTOM">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(104).value()">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="font" VALUE="Arial Black Bold">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="updateRate" VALUE="0.0">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="message">
			<APPLET CODE="StringField.class" WIDTH="800" HEIGHT="100" NAME="sfMessageRed">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="fillColor" VALUE="#000000">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="BOTTOM">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(106).value()">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="font" VALUE="Arial Black Bold">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="fontColor" VALUE="#FF0000">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="updateRate" VALUE="0.0">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="accept">
			<APPLET CODE="FunctionButton.class" WIDTH="154" HEIGHT= "62" NAME="btnAccept">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:InternalRAM.label(108).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnAccept.disappear(), Amulet:UART.word(0).setValue(0x0203)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>

		<DIV ID="cancel">
			<APPLET CODE="FunctionButton.class" WIDTH="154" HEIGHT= "62" NAME="btnCancel">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:InternalRAM.label(109).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnCancel.disappear(),%Back">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
