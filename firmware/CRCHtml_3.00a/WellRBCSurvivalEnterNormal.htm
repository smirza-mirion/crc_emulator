<!--
	String
	100 - Min Normal
	101 - Max Normal
	
	Byte
	100 - Show Grid
	101 - Refresh Row
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_WELL_RBC_SURVIVAL_ENTER_NORMAL);NAME=refreshInit">

		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.sfMin.reappear(),
														     Amulet:document.sfMax.reappear(),
														     Amulet:document.btnMin.forceUpdate(),
														     Amulet:document.btnMin.reappear(),
														     Amulet:document.btnMax.forceUpdate(),
														     Amulet:document.btnMax.reappear(),
														     Amulet:document.btnClear.reappear(),
														     Amulet:document.btnAccept.reappear(),
														     Amulet:document.btnCancel.reappear();
														     Name=refreshShowAll">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(101).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(101).setValue(0),
														     Amulet:document.btnMin.forceUpdate(),
														     Amulet:document.btnMin.reappear(),
														     Amulet:document.btnMax.forceUpdate(),
														     Amulet:document.btnMax.reappear(),
														     Amulet:document.btnClear.reappear();
														     NAME=refreshShowRow">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(102).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(102).setValue(0),
														     Amulet:document.sfTitleView.reappear(),
														     Amulet:document.btnBack.reappear(),
														     Amulet:document.sfMin.reappear(),
														     Amulet:document.sfMax.reappear(),
														     Amulet:document.sfMinValue.forceUpdate(),
														     Amulet:document.sfMinValue.reappear(),
														     Amulet:document.sfMaxValue.forceUpdate(),
														     Amulet:document.sfMaxValue.reappear();
														     Name=refreshShowView">
														     
		<style type="text/css">
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:150;top:0;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
			
			#min_label {position:absolute;left:230;top:100;width:0;height:0}
			#max_label {position:absolute;left:440;top:100;width:0;height:0}
			
			#min {position:absolute;left:230;top:150;width:0;height:0}
			#max {position:absolute;left:440;top:150;width:0;height:0}
			#clear {position:absolute;left:650;top:150;width:0;height:0}
			
			#accept {position:absolute;left:490;top:542;width:0;height:0}
			#cancel {position:absolute;left:645;top:542;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>

		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="500" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="Setup RBC Survival Normal Range">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="500" HEIGHT="69" NAME="sfTitleView">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="RBC Survival Normal Range">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/back_big.png">
				<PARAM NAME="downImage" VALUE="Images/back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="min_label">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="40" NAME="sfMin">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC|UNDERLINE">
				<PARAM NAME="initialCondition" VALUE="Minimum Days">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="max_label">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="40" NAME="sfMax">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC|UNDERLINE">
				<PARAM NAME="initialCondition" VALUE="Maximum Days">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="min">
			<APPLET CODE="CustomButton.class" WIDTH="200" HEIGHT="40" Name="btnMin">
				<PARAM NAME="upImage" VALUE="Images/200x40.png">
				<PARAM NAME="downImage" VALUE="Images/200x40.png">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(100).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="%ConfigTitle('Please Enter Min(days):'), %ConfigMaxStrLen(2), %ConfigMaxFractionLen(1), %ConfigMinValue('1.0'), %ConfigMaxValue('99.0'), %ConfigKeypad(%%CONFIG_KEYPAD_FLOAT), %ConfigPlusMinus_OFF, %SetKeypad(%%SET_KEYPAD_WELL_RBC_SURVIVAL_ENTER_NORM_MIN)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="min">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="40" NAME="sfMinValue">
					<PARAM NAME="border" VALUE="0">
					<PARAM NAME="font" VALUE="Franklin Gothic Book">
					<PARAM NAME="verticalAlign" VALUE="MIDDLE">
					<PARAM NAME="horizontalAlign" VALUE="CENTER">
					<PARAM NAME="fillColor" VALUE="#FFFFFF">
					<PARAM NAME="fontColor" VALUE="blue">
					<PARAM NAME="fontSize" VALUE="18pt">
					<PARAM NAME="fontStyle" VALUE="BOLD">
					<PARAM NAME="initialCondition" VALUE="">
					<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value">
					<PARAM NAME="printf" VALUE="%s">
					<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="max">
			<APPLET CODE="CustomButton.class" WIDTH="200" HEIGHT="40" Name="btnMax">
				<PARAM NAME="upImage" VALUE="Images/200x40.png">
				<PARAM NAME="downImage" VALUE="Images/200x40.png">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(101).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="%ConfigTitle('Please Enter Max(days):'), %ConfigMaxStrLen(2), %ConfigMaxFractionLen(1), %ConfigMinValue('1.0'), %ConfigMaxValue('99.0'), %ConfigKeypad(%%CONFIG_KEYPAD_FLOAT), %ConfigPlusMinus_OFF, %SetKeypad(%%SET_KEYPAD_WELL_RBC_SURVIVAL_ENTER_NORM_MAX)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="max">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="40" NAME="sfMaxValue">
					<PARAM NAME="border" VALUE="0">
					<PARAM NAME="font" VALUE="Franklin Gothic Book">
					<PARAM NAME="verticalAlign" VALUE="MIDDLE">
					<PARAM NAME="horizontalAlign" VALUE="CENTER">
					<PARAM NAME="fillColor" VALUE="#FFFFFF">
					<PARAM NAME="fontColor" VALUE="blue">
					<PARAM NAME="fontSize" VALUE="18pt">
					<PARAM NAME="fontStyle" VALUE="BOLD">
					<PARAM NAME="initialCondition" VALUE="">
					<PARAM NAME="href" VALUE="Amulet:internalRAM.string(101).value">
					<PARAM NAME="printf" VALUE="%s">
					<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="clear">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="40" NAME="btnClear">
				<PARAM NAME="label" VALUE="Clear">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnClear.disappear(),Amulet:UART.word(0).setValue(0x0103)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="accept">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnAccept">
				<PARAM NAME="label" VALUE="Accept">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnAccept.disappear(),Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="cancel">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnCancel">
				<PARAM NAME="label" VALUE="Cancel">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnCancel.disappear(),%Back">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
