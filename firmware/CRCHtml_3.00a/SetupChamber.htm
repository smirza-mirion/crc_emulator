<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_SETUPCHAMBER);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(20).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(20).setValue(0),
													    Amulet:document.sfChamb.reappear(),
													    Amulet:document.sfChamb.forceUpdate();
													    NAME=refreshChambString">
													    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfSerial.reappear(),
														     Amulet:document.sfSerial.forceUpdate(),
														     Amulet:document.sfResponse.reappear(),
														     Amulet:document.sfResponse.forceUpdate(),
														     Amulet:document.sfVoltage.reappear(),
														     Amulet:document.sfVoltage.forceUpdate();
														     NAME=refreshShow">
		
		<style type="text/css">
			#top {position:absolute;left:0;top:0;width:0;height:0}
			#bottom {position:absolute;left:0;top:556;width:0;height:0}
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#currentchamber {position:absolute;left:119;top:543;width:0;height:0}
			#logo {position:absolute;left:5;top:4;width:0;height:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#print {position:absolute;left:695;top:563;width:0;height:0}
			#setup {position:absolute;left:5;top:563;width:0;height:0}
			#seriallabel {position:absolute;left:0;top:100;width:0;height:0}
			#serialtext {position:absolute;left:400;top:100;width:0;height:0}
			#responselabel {position:absolute;left:0;top:200;width:0;height:0}
			#responsetext {position:absolute;left:400;top:200;width:0;height:0}
			#voltagelabel {position:absolute;left:0;top:300;width:0;height:0}
			#voltagetext {position:absolute;left:400;top:300;width:0;height:0}
			
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="Setup Chamber">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<DIV ID="currentchamber">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="50" NAME="sfChamb">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(9).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHome">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Home">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/home_big.png">
				<PARAM NAME="downImage" VALUE="Images/home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/back_big.png">
				<PARAM NAME="downImage" VALUE="Images/back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="seriallabel">
			<TABLE WIDTH="400" HEIGHT="40">
				<TR>
					<TD WIDTH="400" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I>Serial #: </I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="serialtext">
			<APPLET CODE="Stringfield.class" WIDTH="200" HEIGHT="40" NAME="sfSerial">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(101).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="serialtext">
			<APPLET CODE="FunctionButton.class" WIDTH="200" HEIGHT="40" NAME="btnSerial">
				<PARAM NAME="borderColor" VALUE="#FFFFFF00">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle('Enter Chamb Serial#'), %ConfigMaxStrLen(6), %ConfigMaxFractionLen(0), %ConfigMinValue('0.0'), %ConfigMaxValue('0.0'), %ConfigKeypad(%%CONFIG_KEYPAD_DEFAULT), %ConfigPlusMinus_OFF,%SetKeypad(%%SET_KEYPAD_CHAMB_SERIAL)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="responselabel">
			<TABLE WIDTH="400" HEIGHT="40">
				<TR>
					<TD WIDTH="400" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I>Response Correction: </I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="responsetext">
			<APPLET CODE="Stringfield.class" WIDTH="200" HEIGHT="40" NAME="sfResponse">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(102).value()">
				<PARAM NAME="printf" VALUE="%s %%">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="responsetext">
			<APPLET CODE="FunctionButton.class" WIDTH="200" HEIGHT="40" NAME="btnResponse">
				<PARAM NAME="borderColor" VALUE="#FFFFFF00">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle('Enter Chamb Response Correction'), %ConfigMaxStrLen(6), %ConfigMaxFractionLen(3), %ConfigMinValue('0.0'), %ConfigMaxValue('0.0'), %ConfigKeypad(%%CONFIG_KEYPAD_FLOAT), %ConfigPlusMinus_ON,%SetKeypad(%%SET_KEYPAD_CHAMB_RESPCORR)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="voltagelabel">
			<TABLE WIDTH="400" HEIGHT="40">
				<TR>
					<TD WIDTH="400" HEIGHT="40" ALIGN="RIGHT"><FONT SIZE="5" FACE="Franklin Gothic Book"><I>Voltage: </I></FONT></TD>
				</TR>
			</TABLE>
		</DIV>
		
		<DIV ID="voltagetext">
			<APPLET CODE="Stringfield.class" WIDTH="200" HEIGHT="40" NAME="sfVoltage">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(103).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="voltagetext">
			<APPLET CODE="FunctionButton.class" WIDTH="200" HEIGHT="40" NAME="btnVoltage">
				<PARAM NAME="borderColor" VALUE="#FFFFFF00">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle('Enter Chamb Nominal Voltage'), %ConfigMaxStrLen(3), %ConfigMaxFractionLen(2), %ConfigMinValue('0.0'), %ConfigMaxValue('0.0'), %ConfigKeypad(%%CONFIG_KEYPAD_FLOAT), %ConfigPlusMinus_OFF,%SetKeypad(%%SET_KEYPAD_CHAMB_NOMVOLTS)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
