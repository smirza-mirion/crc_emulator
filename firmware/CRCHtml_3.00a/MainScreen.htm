	20	= Show Chamber Label			(TOGGLE)

	2	= Current Time
	3	= Cal Num
	4	= Remote Indicator
	6	= Future Time
	7	= Future Activity
	9	= Current Chamber
	10	= Current Activity
	11	= Current Unit

	102	= HotKey 2
	103	= HotKey 3
	104	= HotKey 4
	105	= HotKey 5
	106	= HotKey 6
