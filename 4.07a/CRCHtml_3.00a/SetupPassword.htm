<!--
	Byte
	100 - Display
	101 - Display Error
	
	String
	90 - Accept
	91 - Cancel
	100 - Title
	101 - Current Password Label
	102 - Current Password
	103 - New Password Label
	104 - New Password
	105 - Confirm Password Label
	106 - Confirm Password
	107,108 - Error Message
	109,110 - Please enter current password
	111,112 - Please enter new password
	113,114 - Please enter confirm password
	115 - Last 3 SN digits
-->
<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_SETUP_PASSWORD);NAME=refreshInit">

		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.sfCurrentLabel.forceUpdate(),
														     Amulet:document.sfCurrent.forceUpdate(),
														     Amulet:document.sfNewLabel.forceUpdate(),
														     Amulet:document.sfNew.forceUpdate(),
														     Amulet:document.sfConfirmLabel.forceUpdate(),
														     Amulet:document.sfConfirm.forceUpdate(),
														     Amulet:document.sfError.forceUpdate(),
														     Amulet:document.btnDefault.forceUpdate(),
														     Amulet:document.btnAccept.forceUpdate(),
														     Amulet:document.btnCancel.forceUpdate();
														     NAME=refreshDisplayPassword">

		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(101).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(101).setValue(0),
														     Amulet:document.btnDefault.reappear(),
														     Amulet:document.btnDefault.forceUpdate(),
														     Amulet:document.btnAccept.reappear(),
														     Amulet:document.btnAccept.forceUpdate(),
														     Amulet:document.btnCancel.reappear(),
														     Amulet:document.btnCancel.forceUpdate(),
														     Amulet:document.sfError.reappear(),
														     Amulet:document.sfError.forceUpdate();
														     NAME=refreshDisplayError">
														     
		<style type="text/css">
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:130;top:0;width:0;height:0}
			#currentlabel {position:absolute;left:10;top:150;width:0;height:0}
			#current {position:absolute;left:300;top:150;width:0;height:0}
			#newlabel {position:absolute;left:10;top:225;width:0;height:0}
			#new {position:absolute;left:300;top:225;width:0;height:0}
			#confirmlabel {position:absolute;left:10;top:300;width:0;height:0}
			#confirm {position:absolute;left:300;top:300;width:0;height:0}
			#error {position:absolute;left:100;top:400;width:0;height:0}
			#default {position:absolute;left:10;top:487;width:0;height:0}
			#accept {position:absolute;left:490;top:542;width:0;height:0}
			#cancel {position:absolute;left:645;top:542;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
		
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="560" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<DIV ID="currentlabel">
			<APPLET CODE="Stringfield.class" WIDTH="280" HEIGHT="40" NAME="sfCurrentLabel">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(101).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="current">
			<APPLET CODE="StringField.class" WIDTH="390" HEIGHT="40" NAME="sfCurrent">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontStyle" VALUE="PLAIN">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(102).value()">
				<PARAM NAME="printf" VALUE=" %s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="current">
			<APPLET CODE="FunctionButton.class" WIDTH="390" HEIGHT="40" NAME="btnCurrent">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="borderColor" VALUE="#00000000">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle(Amulet:InternalRam.string(109).value()), %ConfigMaxStrLen(8), %ConfigMaxFractionLen(0), %ConfigMinValue('0.0'), %ConfigMaxValue('0.0'), %ConfigKeypad(%%CONFIG_KEYPAD_PASSWORD), %ConfigPlusMinus_OFF, %SetKeypad(%%SET_KEYPAD_CURRENT_PASSWORD)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="newlabel">
			<APPLET CODE="Stringfield.class" WIDTH="280" HEIGHT="40" NAME="sfNewLabel">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(103).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="new">
			<APPLET CODE="StringField.class" WIDTH="390" HEIGHT="40" NAME="sfNew">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontStyle" VALUE="PLAIN">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(104).value()">
				<PARAM NAME="printf" VALUE=" %s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="new">
			<APPLET CODE="FunctionButton.class" WIDTH="390" HEIGHT="40" NAME="btnNew">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="borderColor" VALUE="#00000000">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle(Amulet:InternalRam.string(111).value()), %ConfigMaxStrLen(8), %ConfigMaxFractionLen(0), %ConfigMinValue('0.0'), %ConfigMaxValue('0.0'), %ConfigKeypad(%%CONFIG_KEYPAD_PASSWORD), %ConfigPlusMinus_OFF, %SetKeypad(%%SET_KEYPAD_NEW_PASSWORD)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="confirmlabel">
			<APPLET CODE="Stringfield.class" WIDTH="280" HEIGHT="40" NAME="sfConfirmLabel">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(105).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="confirm">
			<APPLET CODE="StringField.class" WIDTH="390" HEIGHT="40" NAME="sfConfirm">
				<PARAM NAME="border" VALUE="1">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontStyle" VALUE="PLAIN">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(106).value()">
				<PARAM NAME="printf" VALUE=" %s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="confirm">
			<APPLET CODE="FunctionButton.class" WIDTH="390" HEIGHT="40" NAME="btnConfirm">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="borderColor" VALUE="#00000000">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="fillColor" VALUE="#00000000">
				<PARAM NAME="href" VALUE="%ConfigTitle(Amulet:InternalRam.string(113).value()), %ConfigMaxStrLen(8), %ConfigMaxFractionLen(0), %ConfigMinValue('0.0'), %ConfigMaxValue('0.0'), %ConfigKeypad(%%CONFIG_KEYPAD_PASSWORD), %ConfigPlusMinus_OFF, %SetKeypad(%%SET_KEYPAD_CONFIRM_PASSWORD)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="error">
			<APPLET CODE="StringField.class" WIDTH="700" HEIGHT="40" NAME="sfError">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontColor" VALUE="#FF0000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(107).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="default">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="40" NAME="btnDefault">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(115).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnAccept.disappear(), Amulet:document.btnCancel.disappear(), Amulet:document.btnDefault.disappear(), %Beep, Amulet:UART.word(0).setValue(0x0103)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="accept">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnAccept">
				<!--PARAM NAME="label" VALUE="Accept"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(90).value()">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnAccept.disappear(), Amulet:document.btnCancel.disappear(), Amulet:document.btnDefault.disappear(), %Beep, Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="cancel">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnCancel">
				<!--PARAM NAME="label" VALUE="Cancel"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(91).value()">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnCancel.disappear(), %Back">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
