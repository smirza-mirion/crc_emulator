<!--
	Byte
	80  - Display Staff Button
	81  - Display Staff Text
	82  - Display Next Button
	100 - Show All
	
	String
	100,101 - Staff Name
	102	- Background
	103	- Neck Measurement
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_WELL_BIOASSAY);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0xFF;URL=Amulet:document.btnStaffText.forceUpdate(),
														   Amulet:document.btnStaffText.reappear();
														   NAME=refreshShowStaffButton">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0;ONVAR=Amulet:internalRAM.byte(81).value();TRIGGER=0xFF;URL=Amulet:document.sfStaffText.forceUpdate(),
														   Amulet:document.sfStaffText.reappear();
														   NAME=refreshShowStaffText">
														   
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0;ONVAR=Amulet:internalRAM.byte(82).value();TRIGGER=0xFF;URL=Amulet:document.btnNext.reappear();
														   NAME=refreshShowNextButton">
														   
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.sfStaffLabel.reappear(),
														     Amulet:document.refreshShowStaffButton.forceUpdate(),
														     Amulet:document.refreshShowStaffText.forceUpdate(),
														     Amulet:document.sfDistanceLabel.reappear(),
														     Amulet:document.btnDistanceText.forceUpdate(),
														     Amulet:document.btnDistanceText.reappear(),
														     Amulet:document.sfBackground.reappear(),
														     Amulet:document.btnBackground.forceUpdate(),
														     Amulet:document.btnBackground.reappear(),
														     Amulet:document.sfNeck.reappear(),
														     Amulet:document.btnNeck.forceUpdate(),
														     Amulet:document.btnNeck.reappear(),
														     Amulet:document.refreshShowNextButton.forceUpdate(),
														     Amulet:document.btnExit.reappear();
														     NAME=refreshShowAll">
		
		<style type="text/css">
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#staff_label {position:absolute;left:0;top:100;width:0;height:0}
			#staff_text {position:absolute;left:395;top:100;width:0;height:0}
			#distance_label {position:absolute;left:0;top:150;width:0;height:0}
			#distance_text {position:absolute;left:395;top:150;width:0;height:0}
			#background_label {position:absolute;left:0;top:200;width:0;height:0}
			#background_text {position:absolute;left:395;top:200;width:0;height:0}
			#neck_label {position:absolute;left:0;top:250;width:0;height:0}
			#neck_text {position:absolute;left:395;top:250;width:0;height:0}
			#next {position:absolute;left:490;top:542;width:0;height:0}
			#exit {position:absolute;left:645;top:542;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="BioAssay">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="staff_label">
			<APPLET CODE="StringField.class" WIDTH="400" HEIGHT="40" NAME="sfStaffLabel">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC">
				<PARAM NAME="initialCondition" VALUE="Staff:">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="staff_text">
			<APPLET CODE="CustomButton.class" WIDTH="380" HEIGHT="40" Name="btnStaffText">
				<PARAM NAME="upImage" VALUE="Images/380x40.png">
				<PARAM NAME="downImage" VALUE="Images/380x40.png">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref(50)">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(100).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="%ActiveStaff,%SelectMode,%SetClear(%%SET_CLEAR_SECURITY)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="staff_text">
			<APPLET CODE="StringField.class" WIDTH="400" HEIGHT="40" NAME="sfStaffText">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="distance_label">
			<APPLET CODE="StringField.class" WIDTH="400" HEIGHT="40" NAME="sfDistanceLabel">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC">
				<PARAM NAME="initialCondition" VALUE="Probe Distance:">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="distance_text">
			<APPLET CODE="CustomButton.class" WIDTH="380" HEIGHT="40" Name="btnDistanceText">
				<PARAM NAME="upImage" VALUE="Images/380x40.png">
				<PARAM NAME="downImage" VALUE="Images/380x40.png">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(102).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="href" VALUE="%ConfigTitle('Please Enter Distance (cm):'), %ConfigMaxStrLen(2), %ConfigMaxFractionLen(0), %ConfigMinValue('10.0'), %ConfigMaxValue('50.0'), %ConfigKeypad(%%CONFIG_KEYPAD_DEFAULT), %ConfigPlusMinus_OFF, %SetKeypad(%%SET_KEYPAD_WELL_RESET_BIOASSAY_DISTANCE)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="background_label">
			<APPLET CODE="StringField.class" WIDTH="400" HEIGHT="40" NAME="sfBackground">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC">
				<PARAM NAME="initialCondition" VALUE="Background:">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="background_text">
			<APPLET CODE="CustomButton.class" WIDTH="380" HEIGHT="40" Name="btnBackground">
				<PARAM NAME="upImage" VALUE="Images/380x40.png">
				<PARAM NAME="downImage" VALUE="Images/380x40.png">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(103).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="Amulet:document.btnBackground.disappear(),%LockDetector,%ConfigTitle('Background Measurement'),%SetWellMeasurement(%%SET_WELLMEASUREMENT_BACKGROUND)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="neck_label">
			<APPLET CODE="StringField.class" WIDTH="400" HEIGHT="40" NAME="sfNeck">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="RIGHT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD|ITALIC">
				<PARAM NAME="initialCondition" VALUE="Neck Measurement:">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="neck_text">
			<APPLET CODE="CustomButton.class" WIDTH="380" HEIGHT="40" Name="btnNeck">
				<PARAM NAME="upImage" VALUE="Images/380x40.png">
				<PARAM NAME="downImage" VALUE="Images/380x40.png">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="onButtonPress" VALUE="ALPHA">
				<PARAM NAME="buttonType" VALUE="SPRING-LOADED">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="14pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="alphaColor" VALUE="#000000FF">
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(104).value()">
				<PARAM NAME="noSdram" VALUE="TRUE">
				<PARAM NAME="repeatDelay" VALUE="0.01">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="href" VALUE="%LockDetector,%ConfigTitle('Measure From Neck'),%SetWellMeasurement(%%SET_WELLMEASUREMENT_BIOASSAY)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="next">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnNext">
				<PARAM NAME="label" VALUE="Next">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnNext.disappear(),Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="exit">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnExit">
				<PARAM NAME="label" VALUE="Exit">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnExit.disappear(),Amulet:UART.word(0).setValue(0x0103)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
