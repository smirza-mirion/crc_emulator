<!--
	Byte
	20 - Show Current Chamber
	21 - Show Chamber Button
	80 - Language (State)
	91 - Show Standard (State)
	92 - Show Lineator (State)
	93 - Show Calicheck (State)
	94 - Show No Linearity Setup (State)
	100 - Show Page (Toggle)
	
	String
	100,101 - Title
	102,103 - Please Enter Password:
	104,105,106,107 - Standard, Lineator and Calicheck are available in setup
	108,109 - AutoLinearity
	110,111 - Standard
	112,113 - Lineator
	114,115 - Calicheck
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<style type="text/css">
			#backgnd {position:absolute;left:0;top:0;width:800;height:600}
			#backgnd1 {position:absolute;left:0;top:41;width:800;height:518}

			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#no_linearity {position:absolute;left:10;top:460;width:0;height:0}
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}

			#currentchamber {position:absolute;left:119;top:543;width:0;height:0}
			#setup {position:absolute;left:692;top:543;width:0;height:0}
		</style>
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00,0.01;URL=%SetScreen(%%SCREEN_SELECT_LINEARITY);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshShowHomeEnglish.forceUpdate(),
							    Amulet:document.refreshShowHomeSpanish.forceUpdate();
							    NAME=refreshShowHome">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x00;URL=Amulet:document.btnHome.reappear();
														    NAME=refreshShowHomeEnglish">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x01;URL=Amulet:document.btnHomeSpanish.reappear();
														    NAME=refreshShowHomeSpanish">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshShowBackEnglish.forceUpdate(),
							    Amulet:document.refreshShowBackSpanish.forceUpdate();
							    NAME=refreshShowBack">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x00;URL=Amulet:document.btnBack.reappear();
														    NAME=refreshShowBackEnglish">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x01;URL=Amulet:document.btnBackSpanish.reappear();
														    NAME=refreshShowBackSpanish">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0;URL=Amulet:document.refreshShowSetupEnglish.forceUpdate(),
							    Amulet:document.refreshShowSetupSpanish.forceUpdate();
							    NAME=refreshShowSetup">

														    NAME=refreshShowSetupSpanish">

														    Amulet:document.btnStandard.reappear();
														    NAME=refreshShowStandard">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0xFF;URL=Amulet:document.btnLineator.forceUpdate(),
														    Amulet:document.btnLineator.reappear();
														    NAME=refreshShowLineator">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(93).value();TRIGGER=0xFF;URL=Amulet:document.btnCalicheck.forceUpdate(),
														    Amulet:document.btnCalicheck.reappear();

														    Amulet:document.btnChamb.reappear();
														    NAME=refreshChambButton">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.refreshShowStandard.forceUpdate(),
														     Amulet:document.refreshShowLineator.forceUpdate(),
														     Amulet:document.refreshShowCalicheck.forceUpdate(),
														     Amulet:document.refreshShowNoLinearity.forceUpdate(),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.refreshShowHome.forceUpdate(),
														     Amulet:document.refreshShowBack.forceUpdate(),
														     Amulet:document.refreshShowSetup.forceUpdate(),
														     Amulet:document.btnAutoLinearity.forceUpdate(),
														     Amulet:document.btnAutoLinearity.reappear();
														     Name=refreshShowDisplay">
