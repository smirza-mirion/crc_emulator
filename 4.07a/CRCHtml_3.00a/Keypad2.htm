<!-- Memory Map
	Byte
	100 = Show keypad (0xFF)
	101 = Show Div button (0xFF)
	102 = Show Mult button (0xFF)
	103 = Show Sub button (0xFF)
	104 = Show Add button (0xFF)
	105 = Show Period button(0xFF)
	106 = Refresh Display (0xFF)
	
	105 = Show Backspace (0xFF)
	106 = Show Backspace small (0xFF)
	107 = Refresh Display (0xFF)
	108 = Show Period button (0xFF)
	109 = Show Backspace medium (0xFF)
	
	Word
	101 = Div X
	102 = Div Y
	103 = Mult X
	104 = Mult Y
	105 = Sub X
	106 = Sub Y
	107 = Add X
	108 = Add Y
	109 = Period X
	110 = Period Y
	
	
	101 = Title X
	102 = Title Y
	
	103 = Display X
	104 = Display Y
	
	105 = Div X
	106 = Div Y
	107 = Mult X
	108 = Mult Y
	109 = Sub X
	110 = Sub Y
	111 = Add X
	112 = Add Y
	
	113 = 7 X
	114 = 7 Y
	115 = 8 X
	116 = 8 Y
	117 = 9 X
	118 = 9 Y
	119 = Enter X
	120 = Enter Y
	
	121 = 4 X
	122 = 4 Y
	123 = 5 X
	124 = 5 Y
	125 = 6 X
	126 = 6 Y
	
	127 = 1 X
	128 = 1 Y
	129 = 2 X
	130 = 2 Y
	131 = 3 X
	132 = 3 Y
	
	133 = 0 X
	134 = 0 Y
	135 = Backspace X
	136 = Backspace Y
	
	137 = Backspace small X
	138 = Backspace small Y
	
	139 = Background X
	140 = Background Y
	
	141 = Period X
	142 = Period Y
	
	143 = Backspace medium X
	144 = Backspace medium Y
	
	String
	100,101 = Title
	102,103 = Number String
	104 	= Backspace
	105	= Accept
	106	= Cancel
	
	LAUNCHES
		%SetKeypad
	REQUIRES 
		%ConfigTitle
		%ConfigX
		%ConfigY
		%ConfigMaxStrLen
		%ConfigKeypad
-->
