<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_ETHERNET);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
		                                                                                                     Amulet:document.btnSend.reappear();
														     NAME=refreshShowSendButton">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(101).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(101).setValue(0),
		                                                                                                     Amulet:document.btnMirror.reappear();
														     NAME=refreshShowMirrorButton">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(102).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(102).setValue(0),
														     Amulet:document.sfSend.reappear();
														     NAME=refreshShowSendMessage">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(103).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(103).setValue(0),
														     Amulet:document.sfMirror.reappear();
														     NAME=refreshShowMirrorMessage">
		
		<style type="text/css">
			#backgnd {position:absolute;left:0;top:0;width:800;height:600}
			#backgnd1 {position:absolute;left:0;top:41;width:800;height:518}
			#top {position:absolute;left:0;top:0;width:0;height:0}
			#bottom {position:absolute;left:0;top:556;width:0;height:0}
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#logo {position:absolute;left:5;top:4;width:0;height:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#print {position:absolute;left:695;top:563;width:0;height:0}
			#setup {position:absolute;left:5;top:563;width:0;height:0}
			#ethernet {position:absolute;left:5;top:380;width:0;height:0}
			#send {position:absolute;left:100;top:100;width:0;height:0}
			#mirror {position:absolute;left:100;top:200;width:0;height:0}
			#sendlabel {position:absolute;left:100;top:300;width:0;height:0}
			#mirrorlabel {position:absolute;left:100;top:300;width:0;height:0}
			#count {position:absolute;left:100;top:400;width:0;height:0}
			
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
			#setup {position:absolute;left:692;top:543;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="Test Ethernet">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHome">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:UART.byte(5).setValue(7)">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/home_big.png">
				<PARAM NAME="downImage" VALUE="Images/home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:UART.byte(5).setValue(6)">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/back_big.png">
				<PARAM NAME="downImage" VALUE="Images/back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="send">
			<APPLET CODE="FunctionButton.class" WIDTH="200" HEIGHT="70" NAME="btnSend">
				<PARAM NAME="label" VALUE="Send Packets">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnSend.disappear(), Amulet:document.btnMirror.disappear(), Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="mirror">
			<APPLET CODE="FunctionButton.class" WIDTH="200" HEIGHT="70" NAME="btnMirror">
				<PARAM NAME="label" VALUE="Echo Packets">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnSend.disappear(), Amulet:document.btnMirror.disappear(), Amulet:UART.word(0).setValue(0x0103)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="sendlabel">
			<APPLET CODE="StringField.class" WIDTH="600" HEIGHT="70" NAME="sfSend">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="Sending Packets%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="mirrorlabel">
			<APPLET CODE="StringField.class" WIDTH="600" HEIGHT="70" NAME="sfMirror">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="Echoing Packets%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="count">
			<APPLET CODE="StringField.class" WIDTH="600" HEIGHT="70" NAME="sfCount">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:InternalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="updateRate" VALUE="1.0">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
