<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_LOW_LEVEL);NAME=refreshInit">

		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.sfMode.reappear(),
														     Amulet:document.sfMode.forceUpdate();
														     NAME=refreshShowMode">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(101).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(101).setValue(0),
														     Amulet:document.btnClear.reappear();
														     NAME=refreshShowClearButton">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(102).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(102).setValue(0),
														     Amulet:document.sfMemStatus.forceUpdate();
														     NAME=refreshShowMemStatus">
														     
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(103).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(103).setValue(0),
														     Amulet:document.btnMemTestOn.disappear(),
														     Amulet:document.btnOff.disappear(),
														     Amulet:document.btnChamber.disappear(),
														     Amulet:document.btnWell.disappear(),
														     Amulet:document.btnClear.disappear(),
														     Amulet:document.btnAccept.disappear(),
														     Amulet:document.btnCancel.disappear(),
														     Amulet:document.sfMode.disappear(),
														     Amulet:document.btnMemTestOff.reappear();
														     NAME=refreshShowMemOff">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(104).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(104).setValue(0),
														     Amulet:document.btnMemTestOff.disappear(),
														     Amulet:document.btnMemTestOn.reappear(),
														     Amulet:document.btnOff.reappear(),
														     Amulet:document.btnChamber.reappear(),
														     Amulet:document.btnWell.reappear(),
														     Amulet:document.btnClear.reappear(),
														     Amulet:document.btnAccept.reappear(),
														     Amulet:document.btnCancel.reappear(),
														     Amulet:document.sfMode.reappear();
														     NAME=refreshShowMemOn">
														     
		<style type="text/css">
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
			
			#mode {position:absolute;left:200;top:80;width:0;height:0}
			#off {position:absolute;left:67;top:155;width:0;height:0}
			#chamber {position:absolute;left:67;top:255;width:0;height:0}
			#well {position:absolute;left:67;top:355;width:0;height:0}
			#clear {position:absolute;left:67;top:455;width:0;height:0}
			
			#mem_text {position:absolute;left:434;top:155;width:0;height:0}
			#mem_test_on {position:absolute;left:434;top:255;width:0;height:0}
			#mem_test_off {position:absolute;left:434;top:355;width:0;height:0}
			
			#accept {position:absolute;left:490;top:542;width:0;height:0}
			#cancel {position:absolute;left:645;top:542;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="Low Level Debug">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="printf" VALUE="%s">
			</APPLET>
		</DIV>
		
		<!--DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHome">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Home">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/home_big.png">
				<PARAM NAME="downImage" VALUE="Images/home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV-->
		
		<!--DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/back_big.png">
				<PARAM NAME="downImage" VALUE="Images/back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV-->
		
		<DIV ID="mode">
			<APPLET CODE="Stringfield.class" WIDTH="600" HEIGHT="50" NAME="sfMode">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="22pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="hoizontalAlign" VALUE="LEFT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="Low Level Debug Mode: %.51s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="off">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="70" NAME="btnOff">
				<PARAM NAME="label" VALUE="Off">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="chamber">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="70" NAME="btnChamber">
				<PARAM NAME="label" VALUE="Low Level Chamber">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:UART.word(0).setValue(0x0103)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="well">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="70" NAME="btnWell">
				<PARAM NAME="label" VALUE="Low Level Well">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:UART.word(0).setValue(0x0104)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="mem_text">
			<APPLET CODE="Stringfield.class" WIDTH="300" HEIGHT="50" NAME="sfMemStatus">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="5">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="hoizontalAlign" VALUE="RIGHT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(110).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="mem_test_on">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="70" NAME="btnMemTestOn">
				<PARAM NAME="label" VALUE="Memory Test On">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:UART.word(0).setValue(0x0107)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="mem_test_off">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="70" NAME="btnMemTestOff">
				<PARAM NAME="label" VALUE="Memory Test Off">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:UART.word(0).setValue(0x0a0b)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="clear">
			<APPLET CODE="FunctionButton.class" WIDTH="300" HEIGHT="70" NAME="btnClear">
				<!--PARAM NAME="label" VALUE="Clear Debug Files"-->
				<PARAM NAME="label" VALUE="Manual Settings">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<!--PARAM NAME="href" VALUE="Amulet:document.btnClear.disappear(),Amulet:UART.word(0).setValue(0x0106)"-->
				<PARAM NAME="href" VALUE="%SetHTML(%%SET_HTML_WELL_MANUAL)">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="accept">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnAccept">
				<PARAM NAME="label" VALUE="Accept">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="green">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnAccept.disappear(), Amulet:UART.word(0).setValue(0x0105)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="cancel">
			<APPLET CODE="FunctionButton.class" WIDTH="150" HEIGHT="50" NAME="btnCancel">
				<PARAM NAME="label" VALUE="Cancel">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="red">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="href" VALUE="Amulet:document.btnCancel.disappear(), %Back">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
