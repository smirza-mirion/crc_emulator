<!-- Memory Map
	Byte
	20	= Show Chamber Label (TOGGLE)
	21	= Show Chamber Button (TOGGLE)
	80	= Language (State)
	91	= Show Start Test Button (STATE)
	92	= Show Resume Test Button (STATE)
	93	= Show Reports Button (STATE)
	100	= Show Screen (TOGGLE)
	
	String
	9	= Chamber Label
	100,101	= AutoLinearity
	102,103	= Start Test
	104,105 = Resume Test
	106,107 = Reports
-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<style type="text/css">
			#backgnd {position:absolute;left:0;top:0;width:800;height:600}
			#backgnd1 {position:absolute;left:0;top:41;width:800;height:518}
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#home {position:absolute;left:8;top:13;width:0;height:0}
			#back {position:absolute;left:693;top:13;width:0;height:0}
			#chamb {position:absolute;left:8;top:543;width:0;height:0}
			#currentchamber {position:absolute;left:119;top:543;width:0;height:0}
			#start_resume {position:absolute;left:200;top:179;width:0;height:0}
			#reports {position:absolute;left:200;top:358;width:0;height:0}
		</style>
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00,0.01;URL=%SetScreen(%%SCREEN_AUTOLINEARITY);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;URL=Amulet:document.refreshShowHomeEnglish.forceUpdate(),
							     Amulet:document.refreshShowHomeSpanish.forceUpdate();
							     NAME=refreshShowHome">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x00;URL=Amulet:document.btnHome.reappear();
													        NAME=refreshShowHomeEnglish">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x01;URL=Amulet:document.btnHomeSpanish.reappear();
													        NAME=refreshShowHomeSpanish">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;URL=Amulet:document.refreshShowBackEnglish.forceUpdate(),
							     Amulet:document.refreshShowBackSpanish.forceUpdate();
							     NAME=refreshShowBack">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x00;URL=Amulet:document.btnBack.reappear();
													        NAME=refreshShowBackEnglish">
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(80).value();TRIGGER=0x01;URL=Amulet:document.btnBackSpanish.reappear();
													        NAME=refreshShowBackSpanish">
														
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(91).value();TRIGGER=0xFF;URL=Amulet:document.btnStartTest.forceUpdate(),
														    Amulet:document.btnStartTest.reappear();
														    NAME=refreshShowStartTest">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(92).value();TRIGGER=0xFF;URL=Amulet:document.btnResumeTest.forceUpdate(),
														    Amulet:document.btnResumeTest.reappear();
														    NAME=refreshShowResumeTest">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.00;ONVAR=Amulet:internalRAM.byte(93).value();TRIGGER=0xFF;URL=Amulet:document.btnReports.forceUpdate(),
														    Amulet:document.btnReports.reappear();
														    NAME=refreshShowReports">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
														     Amulet:document.refreshShowStartTest.forceUpdate(),
														     Amulet:document.refreshShowResumeTest.forceUpdate(),
														     Amulet:document.refreshShowReports.forceUpdate(),
														     Amulet:document.sfTitle.forceUpdate(),
														     Amulet:document.sfTitle.reappear(),
														     Amulet:document.refreshShowHome.forceUpdate(),
														     Amulet:document.refreshShowBack.forceUpdate();
														     NAME=refreshShowAll">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(20).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(20).setValue(0),
													    	    Amulet:document.sfChamb.reappear(),
														    Amulet:document.sfChamb.forceUpdate();
														    NAME=refreshChambString">
														    
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(21).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(21).setValue(0),
														    Amulet:document.btnChamb.reappear();
														    NAME=refreshChambButton">
	</HEAD>
	
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<!--PARAM NAME="initialCondition" VALUE="AutoLinearity"-->
				<!--PARAM NAME="href" VALUE="Amulet:NOP()"-->
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%.51s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHome">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Home">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/home_big.png">
				<PARAM NAME="downImage" VALUE="Images/home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="home">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnHomeSpanish">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Home">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/spanish_home_big.png">
				<PARAM NAME="downImage" VALUE="Images/spanish_home_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBack">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/back_big.png">
				<PARAM NAME="downImage" VALUE="Images/back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="back">
			<APPLET CODE="CustomButton.class" WIDTH="100" HEIGHT="50" NAME="btnBackSpanish">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%Back">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/spanish_back_big.png">
				<PARAM NAME="downImage" VALUE="Images/spanish_back_big.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="chamb">
			<APPLET CODE="CustomButton.class" WIDTH="101" HEIGHT="50" NAME="btnChamb">
				<PARAM NAME="label" VALUE="">
				<PARAM NAME="href" VALUE="%SetHTML(%%SET_HTML_SELECT_CHAMBER)">
				<PARAM NAME="onButtonPress" VALUE="GRAY">
				<PARAM NAME="upImage" VALUE="Images/ch_33.png">
				<PARAM NAME="downImage" VALUE="Images/ch_33.png">
				<PARAM NAME="repeatRate" VALUE="0.00">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="currentchamber">
			<APPLET CODE="StringField.class" WIDTH="200" HEIGHT="50" NAME="sfChamb">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="LEFT">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(9).value()">
				<PARAM NAME="printf" VALUE="%s">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="start_resume">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnStartTest">
				<!--PARAM NAME="label" VALUE="Start Test"-->
				<PARAM NAME="label" VALUE="FromInitHref(51)">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(102).value()">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="href" VALUE="%SetClear(%%SET_CLEAR_AUTOLINEARITYTEST)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="start_resume">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnResumeTest">
				<!--PARAM NAME="label" VALUE="Resume Test"-->
				<PARAM NAME="label" VALUE="FromInitHref(51)">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(104).value()">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="href" VALUE="%ConfigGenericYesNo(%%SET_GENERICYESNO_RESUME_AUTOLIN),%SetHTML(%%SET_HTML_GENERIC_YES_NO)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="reports">
			<APPLET CODE="FunctionButton.class" WIDTH="400" HEIGHT="70" NAME="btnReports">
				<!--PARAM NAME="label" VALUE="Reports"-->
				<PARAM NAME="label" VALUE="FromInitHref(51)">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(106).value()">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="18pt">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="blue">
				<PARAM NAME="href" VALUE="%SetClear(%%SET_CLEAR_AUTOLINEAIRTYSEARCH)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
