	Memory Map
	Byte
	20	= Show Chamber Label (TOGGLE)

	101	= Inactivate Button (STATE) FF = Inactivate Button, FE = Inactivate Reason
	102	= Redisplay Buttons (TOGGLE)
	103	= Display Voltage Red (STATE)
	
	String
	100,101	= Title
	102	= Chamber Description
	103	= Chamber Serial Number
	104	= Date
	105	= Voltage Label
	106,107	= Voltage
	108	= Nominal Label
	109,110 = Nominal
	111	= Min Label
	112,113 = Min
	114	= Max Label
	115,116 = Max
	117	= Inactivate
