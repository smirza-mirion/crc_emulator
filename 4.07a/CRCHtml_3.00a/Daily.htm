	20		= Show Chamber Label	(TOGGLE)

	189		= State Change		(TOGGLE)

			  FE
			  FD
			  FC
			  FB
			  FA
	
	
	
	String
	9		= Current Chamber
	
	80		= Title
	81,82		= Please Enter Password:
	83,84		= 1) Remove All Sources from Chamber
	85		= OK
	86,87		= 2) Auto Zero
	88,89		= 3) Measure Backgnd
	90,91		= 4) Check Chamber Voltage
	92,93		= 5) Data Check
	94		= Continue
	95		= Accuracy
	100		= Background Result
	120		= Extra Line
	150		= Value Zero
	174,175,176	= Source Data
	189		= Source Data Result 1
	190		= Zero Result
	191		= Chamber Volts Result
	192		= Data Check Result
