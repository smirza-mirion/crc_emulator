<!--
	Byte

	String
	100,101 - Title
	102 - Yes
	103 - No
	104,105 - Delete Lineator Settings?


-->

<HTML>
	<HEAD>
		<META Name="Amulet" CONTENT="ReloadInternalRAM.Page"></META>
		<META NAME="Macro" SRC="Amulet.h">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.0,0.01;URL=%SetScreen(%%SCREEN_DELETE_CALICHECK);NAME=refreshInit">
		
		<META HTTP-EQUIV="REFRESH" CONTENT="0.01;ONVAR=Amulet:internalRAM.byte(100).value();TRIGGER=0xFF;URL=Amulet:internalRAM.byte(100).setValue(0),
													     	   Amulet:document.sfTitle.reappear(),
													         Amulet:document.sfTitle.forceUpdate(),
													     	   Amulet:document.sfDelete.reappear(),
													         Amulet:document.sfDelete.forceUpdate(),
														     Amulet:document.btnYes.reappear(),
														     Amulet:document.btnYes.forceUpdate(),
														     Amulet:document.btnNo.reappear(),
														     Amulet:document.btnNo.forceUpdate();
														     NAME=refreshShow">
		
		<style type="text/css">
			#backgnd {position:absolute;left:0;top:0;width:800;height:600}
			#backgnd1 {position:absolute;left:0;top:41;width:800;height:518}
			#top {position:absolute;left:0;top:0;width:0;height:0}
			#bottom {position:absolute;left:0;top:556;width:0;height:0}
			#topbar {position:absolute;left:0;top:0;height:0;width:0}
			#bottombar {position:absolute;left:0;top:537;height:0;width:0}
			#logo {position:absolute;left:5;top:1;width:0;height:0}
			#title {position:absolute;left:5;top:0;width:0;height:0}
			#message {position:absolute;left:5;top:563;width:0;height:0}
			#back {position:absolute;left:695;top:10;width:0;height:0}
			#print {position:absolute;left:695;top:563;width:0;height:0}
			#setup {position:absolute;left:5;top:563;width:0;height:0}
			#question {position:absolute;left:20;top:100;width:0;height:0}
			#yes {position:absolute;left:480;top:100;width:0;height:0}
			#no {position:absolute;left:650;top:100;width:0;height:0}
		</style>
	</HEAD>
	<BODY>
		<DIV ID="topbar">
			<IMG SRC="Images/top_bar.png" WIDTH="800" HEIGHT="69">
		</DIV>
	
		<DIV ID="bottombar">
			<IMG SRC="Images/bottom_bar.png" WIDTH="800" HEIGHT="63">
		</DIV>
		<DIV ID="title">
			<APPLET CODE="StringField.class" WIDTH="791" HEIGHT="69" NAME="sfTitle">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fillColor" VALUE="#FFFFFF00">
				<PARAM NAME="fontColor" VALUE="#FFFFFF">
				<PARAM NAME="fontSize" VALUE="24pt">
				<!--PARAM NAME="initialCondition" VALUE="Delete Calicheck Settings">
				<PARAM NAME="href" VALUE="Amulet:NOP()">
				<PARAM NAME="initialCondition" VALUE=""-->
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(100).value()">
				<PARAM NAME="printf" VALUE="%.51s">
			</APPLET>
		</DIV>
		
		<DIV ID="question">
			<!--TABLE WIDTH="380" HEIGHT="40">
				<TR>
					<TD WIDTH="380" HEIGHT="40" ALIGN="LEFT"><FONT SIZE="6" FACE="Franklin Gothic Book"><I>Delete Calicheck Settings?</I></FONT></TD>
				</TR>
			</TABLE-->
			<APPLET CODE="Stringfield.class" WIDTH="460" HEIGHT="40" NAME="sfDelete">
				<PARAM NAME="border" VALUE="0">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="fontSize" VALUE="24pt">
				<PARAM NAME="fontColor" VALUE="#000000">
				<PARAM NAME="fillColor" VALUE="#FFFFFF">
				<PARAM NAME="fontStyle" VALUE="ITALIC">
				<PARAM NAME="initialCondition" VALUE="">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="href" VALUE="Amulet:internalRAM.string(104).value()">
				<PARAM NAME="printf" VALUE=" %.51s">
				<PARAM NAME="invisible" VALUE="FALSE">
			</APPLET>
		</DIV>
		
		<DIV ID="yes">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="50" NAME="btnYes">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="green">
				<!--PARAM NAME="label" VALUE="YES"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(102).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnYes.disappear(), Amulet:UART.word(0).setValue(0x0102)">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
		
		<DIV ID="no">
			<APPLET CODE="FunctionButton.class" WIDTH="140" HEIGHT="50" NAME="btnNo">
				<PARAM NAME="font" VALUE="Franklin Gothic Book">
				<PARAM NAME="verticalAlign" VALUE="MIDDLE">
				<PARAM NAME="horizontalAlign" VALUE="CENTER">
				<PARAM NAME="fontSize" VALUE="20pt">
				<PARAM NAME="fontStyle" VALUE="BOLD">
				<PARAM NAME="fontColor" VALUE="red">
				<!--PARAM NAME="label" VALUE="NO"-->
				<PARAM NAME="label" VALUE="FromInitHref">
				<PARAM NAME="initHref" VALUE="Amulet:internalRAM.label(103).value()">
				<PARAM NAME="href" VALUE="Amulet:document.btnNo.disappear(), %Back">
				<PARAM NAME="invisible" VALUE="TRUE">
			</APPLET>
		</DIV>
	</BODY>
</HTML>
