<!--
	Memory Map
	
	Byte
	92		= Language		(STATE) English = 0, French = 1
	93		= CRC-77t		(STATE) Not CRC-77t = 0, CRC-77t = 1
	100	- Display Data (0xFF)
	
	String
	100,101 - Nuclide
	102	- Original R Cal
	103	- Original P Cal
	104	- User R Cal
	105	- User P Cal
	110  -  Title
	111  -  Nuclide Label
	112  - Default RCal Label
	113  - Default PCal Label
	114  - User RCal Label
	115  - User PCal Label
	116 - 117  - Please Enter R Cal#
	118 - 119  - Please Enter P Cal# 
	120,121	- Please Select Nuclide
-->
