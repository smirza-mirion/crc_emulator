<!--
	InternalRAM Map
	Byte
		20	= Show Chamber Label (TOGGLE)
		80	= Language		(STATE) English = 0, French = 1
		189 = 0xFF - Displays "No Cal Number" error
		190 = 0xFF - Displays the Container Label, radio button Syringe and radio button Vial
		191 = 0xFF - Displays Volume Range Error
		192 = 0xFF - Hides Volume Range Error
		193 = 0xFF - Hides Keypad and Display Initial Volume Result
		194 = 0xFF - Show Added Volume Keypad, enable Initial Activity Result
		195 = 0xFF - Hides Keypad and Display Added Volume Result.
		196 = 0xFF - Show 'Another Volume', 'Finished' buttons and enable Added Activity Result.
		197 = 0xFF - Get Additional Measurement
		198 = 0xFF - Show 'Finished' button and enable Add Activity Result
	Word
		224 = Error Y offset
		225 = Error X offset
		226 = Keypad Y offset
		227 = Keypad X offset
		228 = Button Enter Y offset
		229 = Button Enter X offset
		230 = Button Backspace Y offset
		231 = Button Backspace X offset
		232 = Button Dot Y offset
		233 = Button Dot X offset
		234 = Button 0 Y offset
		235 = Button 0 X offset
		236 = Button 3 Y offset
		237 = Button 3 X offset
		238 = Button 2 Y offset
		239 = Button 2 X offset
		240 = Button 1 Y offset
		241 = Button 1 X offset
		242 = Button 6 Y offset
		243 = Button 6 X offset
		244 = Button 5 Y offset
		245 = Button 5 X offset
		246 = Button 4 Y offset
		247 = Button 4 X offset
		248 = Button 9 Y offset
		249 = Button 9 X offset
		250 = Button 8 Y offset
		251 = Button 8 X offset
		252 = Button 7 Y offset
		253 = Button 7 X offset
		254 = Keypad display Y offset
		255 = Keypad display X offset
	String
		5   = Initial Volume
		9   = Chamber Info
		70,71  = Title
		72  = 1) Container
		73,74 = 2) Initial Volume
		75 = Initial Measurement
		76,77 = 4) Added Volume
		78,79 = 4) Volume
		80 = Measurement
		81,82 = CAL # NOT ENTERED FOR NUCLIDE
		83 = BackSP
		84 = Accept
		85,86 = More Measurements
		87 = Finished
		88 = Syringe
		89 = Vial
		189 = Label of the selected container (Syringe or Vial)
		190 = Running activity for measurement
		191 = Result of initial measurement
		192,193,194 = Keypad Error
		195,196,197 = Added Volume String
-->
