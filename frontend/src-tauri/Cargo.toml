[package]
name = "crc-emulator"
version = "1.0.0"
description = "CRC-25R Radio Nuclide Calibrator Emulator"
authors = ["Capintec/Mirion Technologies"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
